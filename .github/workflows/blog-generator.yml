name: 블로그 자동 생성

on:
  # 예약(cron) 제거 — 로컬에서 트리거(dispatch)로 실행하므로 중복 방지
  workflow_dispatch:
    inputs:
      source:
        description: "소재 국적 (kr=국내 증권 RSS / us=미국 NewsAPI)"
        required: false
        default: "us"
        type: choice
        options: ["us", "kr"]

jobs:
  generate:
    runs-on: ubuntu-latest
    # 평소 1~2분. 멈춘 실행이 러너 시간을 계속 잡아먹지 않게 제한
    timeout-minutes: 15
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm ci

      - name: 블로그 생성 실행
        run: node blogGenerator.js
        env:
          # 지정하지 않으면 blogGenerator.js가 "us"로 떨어진다(기존 동작 보존).
          NEWS_SOURCE: ${{ inputs.source }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXELS_API_KEY: ${{ secrets.PIXELS_API_KEY }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}